<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Đăng Ký Người Dùng</title>

    <!-- Bootstrap CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow-sm">

                    <div class="card-body p-4 p-md-5">

                        <!-- TIEU DE -->

                        <h1 class="text-center mb-3">
                            Đăng Ký Tài Khoản
                        </h1>

                        <p class="text-center text-muted mb-4">
                            Vui lòng điền đầy đủ thông tin bên dưới.
                        </p>

                        <!-- FORM -->

                        <form>

                            <!-- HO VA TEN -->

                            <div class="mb-3">

                                <label
                                    for="fullName"
                                    class="form-label">

                                    Họ và tên

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="fullName"
                                    placeholder="Nhập họ và tên"
                                    required>

                            </div>

                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label">

                                    Email

                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="example@email.com"
                                    required>

                                <div class="form-text">

                                    Chúng tôi sẽ không chia sẻ email của bạn.

                                </div>

                            </div>

                            <!-- MAT KHAU -->

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label">

                                    Mật khẩu

                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Nhập mật khẩu"
                                    required>

                            </div>

                            <!-- XAC NHAN MAT KHAU -->

                            <div class="mb-4">

                                <label
                                    for="confirmPassword"
                                    class="form-label">

                                    Xác nhận mật khẩu

                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirmPassword"
                                    placeholder="Nhập lại mật khẩu"
                                    required>

                            </div>

                            <!-- GIOI TINH -->

                            <div class="mb-4">

                                <label class="form-label d-block">

                                    Giới tính

                                </label>

                                <div class="form-check form-check-inline">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="male"
                                        value="male"
                                        checked>

                                    <label
                                        class="form-check-label"
                                        for="male">

                                        Nam

                                    </label>

                                </div>

                                <div class="form-check form-check-inline">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="female"
                                        value="female">

                                    <label
                                        class="form-check-label"
                                        for="female">

                                        Nữ

                                    </label>

                                </div>

                                <div class="form-check form-check-inline">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="other"
                                        value="other">

                                    <label
                                        class="form-check-label"
                                        for="other">

                                        Khác

                                    </label>

                                </div>

                            </div>

                            <!-- SO THICH -->

                            <div class="mb-4">

                                <label class="form-label d-block">

                                    Sở thích

                                </label>

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="coding">

                                    <label
                                        class="form-check-label"
                                        for="coding">

                                        Lập trình

                                    </label>

                                </div>

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="music">

                                    <label
                                        class="form-check-label"
                                        for="music">

                                        Âm nhạc

                                    </label>

                                </div>

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="sports">

                                    <label
                                        class="form-check-label"
                                        for="sports">

                                        Thể thao

                                    </label>

                                </div>

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="travel">

                                    <label
                                        class="form-check-label"
                                        for="travel">

                                        Du lịch

                                    </label>

                                </div>

                            </div>

                            <!-- QUOC GIA -->

                            <div class="mb-4">

                                <label
                                    for="country"
                                    class="form-label">

                                    Quốc gia

                                </label>

                                <select
                                    class="form-select"
                                    id="country"
                                    required>

                                    <option value="" selected disabled>

                                        Chọn quốc gia

                                    </option>

                                    <option value="vn">
                                        Việt Nam
                                    </option>

                                    <option value="us">
                                        Hoa Kỳ
                                    </option>

                                    <option value="jp">
                                        Nhật Bản
                                    </option>

                                    <option value="kr">
                                        Hàn Quốc
                                    </option>

                                    <option value="sg">
                                        Singapore
                                    </option>

                                </select>

                            </div>

                            <!-- DIEU KHOAN -->

                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms"
                                    required>

                                <label
                                    class="form-check-label"
                                    for="terms">

                                    Tôi đồng ý với các điều khoản sử dụng.

                                </label>

                            </div>

                            <!-- SUBMIT -->

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg">

                                    Đăng Ký

                                </button>

                            </div>

                        </form>

                        <!-- TEXT PHU -->

                        <p class="text-center text-muted mt-4 mb-0">

                            Đã có tài khoản?
                            <a href="#" class="text-decoration-none">
                                Đăng nhập
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
